[project]
name = "downme"
version = "0.1.0"
description = "DownMe personal media extraction service and PWA"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "yt-dlp>=2026.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
downme = "run_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
