<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Offline — DownMe</title>
  <meta name="description" content="DownMe is currently offline. Please check your internet connection.">

  <!-- Apple & PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DownMe">
  <meta name="theme-color" content="#000000">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png">

  <!-- Preload Thmanyah Typeface -->
  <link rel="preload" href="/fonts/thmanyahsans-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="/fonts/thmanyahsans-Bold.otf" as="font" type="font/otf" crossorigin>

  <!-- Typography & Apple Tokens -->
  <link rel="stylesheet" href="/css/thmanyah-typography.css">
  <link rel="stylesheet" href="/css/apple-theme.css">

  <style>
    /* Offline Page Layout & Apple HIG Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary, #000000);
      color: var(--text-primary, #ffffff);
      font-family: var(--font-sans, 'Thmanyah Sans', -apple-system, BlinkMacSystemFont, sans-serif);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 24px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 20px);
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .offline-card {
      width: 100%;
      max-width: 440px;
      padding: 40px 28px;
      background: var(--bg-surface, rgba(255, 255, 255, 0.05));
      backdrop-filter: var(--glass-blur, blur(24px) saturate(190%));
      -webkit-backdrop-filter: var(--glass-blur, blur(24px) saturate(190%));
      border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.08));
      border-radius: var(--radius-xl, 28px);
      box-shadow: var(--shadow-lg, 0 16px 40px rgba(0, 0, 0, 0.6));
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .offline-icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
    }

    .offline-icon-wrapper svg {
      width: 32px;
      height: 32px;
      color: var(--text-secondary, rgba(255, 255, 255, 0.64));
    }

    .offline-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-pill, 9999px);
      background: rgba(255, 69, 58, 0.15);
      border: 1px solid rgba(255, 69, 58, 0.3);
      color: var(--accent-red, #ff453a);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
      transition: all 300ms var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1));
    }

    .offline-status-pill.reconnected {
      background: rgba(48, 209, 88, 0.15);
      border-color: rgba(48, 209, 88, 0.3);
      color: var(--accent-green, #30d158);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulse-dot 2s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .offline-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
      color: var(--text-primary, #ffffff);
    }

    .offline-subtitle {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text-secondary, rgba(255, 255, 255, 0.64));
      margin-bottom: 28px;
      font-weight: 400;
    }

    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn-retry {
      width: 100%;
      height: 48px;
      border-radius: var(--radius-pill, 9999px);
      background: var(--text-primary, #ffffff);
      color: #000000;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 150ms cubic-bezier(0.16, 1, 0.3, 1), opacity 150ms ease;
    }

    .btn-retry:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-return {
      background: transparent;
      color: var(--text-secondary, rgba(255, 255, 255, 0.64));
      font-size: 0.85rem;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: var(--radius-md, 14px);
      transition: color 150ms ease;
      display: inline-block;
    }

    .btn-return:hover {
      color: var(--text-primary, #ffffff);
    }

    .brand-footer {
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--text-tertiary, rgba(255, 255, 255, 0.38));
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <main class="offline-card" role="main" aria-labelledby="offline-heading">
    <!-- Offline Indicator Icon -->
    <div class="offline-icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <!-- Status Pill -->
    <div id="status-pill" class="offline-status-pill">
      <span class="status-dot"></span>
      <span id="status-text">No Connection</span>
    </div>

    <h1 id="offline-heading" class="offline-title">You Are Offline</h1>
    <p id="offline-description" class="offline-subtitle">
      DownMe requires an active internet connection to extract and stream media from YouTube, Facebook, TikTok, and Pinterest.
    </p>

    <!-- Actions -->
    <div class="offline-actions">
      <button id="retry-btn" class="btn-retry" type="button" aria-label="Retry network connection">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span>Try Again</span>
      </button>
      <a href="/" class="btn-return">Return to DownMe</a>
    </div>

    <footer class="brand-footer">
      DownMe &copy; 2026 · Pure Minimalist Media Distiller
    </footer>
  </main>

  <script>
    (function () {
      const statusPill = document.getElementById('status-pill');
      const statusText = document.getElementById('status-text');
      const retryBtn = document.getElementById('retry-btn');
      const description = document.getElementById('offline-description');

      function handleOnline() {
        if (statusPill && statusText) {
          statusPill.classList.add('reconnected');
          statusText.textContent = 'Connection Restored';
        }
        if (description) {
          description.textContent = 'Online connectivity detected. Reloading DownMe...';
        }
        // Auto-reconnect after 800ms
        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      }

      function handleOffline() {
        if (statusPill && statusText) {
          statusPill.classList.remove('reconnected');
          statusText.textContent = 'No Connection';
        }
        if (description) {
          description.textContent = 'DownMe requires an active internet connection to extract and stream media. Reconnect to resume.';
        }
      }

      // Listen to native online/offline window events
      window.addEventListener('online', handleOnline);
      window.addEventListener('offline', handleOffline);

      // Check initial state
      if (navigator.onLine) {
        // If navigator says we are online, attempt reload
        handleOnline();
      }

      // Manual retry button
      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          retryBtn.style.opacity = '0.6';
          retryBtn.disabled = true;
          if (navigator.onLine) {
            window.location.reload();
          } else {
            // Test reachability with fetch
            fetch('/', { method: 'HEAD', cache: 'no-store' })
              .then(() => {
                window.location.href = '/';
              })
              .catch(() => {
                retryBtn.style.opacity = '1';
                retryBtn.disabled = false;
                if (statusText) statusText.textContent = 'Still Offline';
              });
          }
        });
      }
    })();
  </script>
</body>
</html>
